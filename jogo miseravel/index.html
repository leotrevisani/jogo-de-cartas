<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Cartas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <h1>Jogo de cartas</h1>

        <p>
            Escolha uma carta para jogar:
        </p>

        <div id="cartas"></div>

        <h2>Resultados:</h2>
        <p id="resultado">
            Carregando Cartas...
        </p>

        <div class="placar">
            <p>
                Jogador:
                <span id="pontosJogador">
                    0
                </span>
            </p>

            <p>
                Computador:
                <span id="pontosComputador">
                    0
                </span>
            </p>
        </div>

        <button id="reiniciar">
            Reiniciar Placar
        </button>
    </main>

    <script src="./script.js"></script>
</body>
</html>
